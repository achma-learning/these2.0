# Daily check of https://wd.fmpm.uca.ma/biblio/theses/Accueil.html (+ lib.fmpm.uca.ma for jury).
#
# update_theses.py rebuilds the whole dataset from the sources and compares it with the file in the
# repo: identical -> "changed=false", the data file is left untouched and charts are NOT redrawn.
# Different -> new json + matplotlib charts in vercel-page/, committed the same day (Vercel redeploys
# through its git integration), so a newly published thesis shows up within a day.
#
# Commits: only when the data changed, plus status.json (date of the last check, shown as
# "vérifié le …") on Mondays and on manual runs. Quiet days commit nothing: no empty commits, no
# needless Vercel deploys.
#
# GitHub disables a scheduled workflow after 60 days without activity in a public repo. Two guards:
# the Monday commit is repo activity, and every scheduled run re-enables this workflow through the API
# (keep-alive step). GitHub also emails the owner before disabling one; re-enable it from the Actions tab.
#
# Faculty server blocking GitHub's runners? Export the CSV with the FMPM userscript
# (greasyfork #600588, "Exporter CSV brut") and commit it as vercel-page/json/official-export.csv:
# it is used for every year the site doesn't answer.
name: Update data

on:
  schedule:
    - cron: "17 4 * * *" # every day, 04:17 UTC (05:17 in Morocco); off the hour, GitHub delays :00 jobs
  workflow_dispatch:
    inputs:
      redraw_charts:
        description: "Redraw the charts even if the data did not change (after editing build_charts.py)"
        type: boolean
        default: false

permissions:
  contents: write
  actions: write # keep-alive: re-enable this workflow

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: vercel-page/scripts/requirements.txt

      - run: pip install -r vercel-page/scripts/requirements.txt

      - name: Check the sources, rebuild the data if they changed
        id: data
        run: python vercel-page/scripts/update_theses.py --json vercel-page/json/file.json

      - name: Draw dashboard (matplotlib)
        if: steps.data.outputs.changed == 'true' || inputs.redraw_charts
        run: python vercel-page/scripts/build_charts.py --json vercel-page/json/file.json --out vercel-page/public/stats

      - name: Commit
        env:
          CHANGED: ${{ steps.data.outputs.changed }}
          EVENT: ${{ github.event_name }}
          BRANCH: ${{ github.ref_name }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ "$CHANGED" = "true" ]; then
            git add vercel-page/json vercel-page/public/stats
            git commit -m "data: official site changed, refresh $(date -u +%F)"
          elif [ "$(date -u +%u)" = "1" ] || [ "$EVENT" = "workflow_dispatch" ]; then
            git add vercel-page/json/status.json vercel-page/public/stats
            git diff --cached --quiet || git commit -m "data: weekly check $(date -u +%F), no change"
          else
            echo "No change today: nothing committed (status.json is committed on Mondays)"
          fi
          if [ -n "$(git log "origin/$BRANCH..HEAD" --oneline)" ]; then
            git pull --rebase --autostash origin "$BRANCH" && git push origin "HEAD:$BRANCH"
          fi

      - name: Keep the schedule alive
        if: github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/update-data.yml/enable"
