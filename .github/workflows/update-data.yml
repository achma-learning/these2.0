# Weekly check of https://wd.fmpm.uca.ma/biblio/theses/Accueil.html (+ lib.fmpm.uca.ma for jury).
#
# update_theses.py rebuilds the whole dataset from the sources and compares it with the file in the
# repo: identical -> "changed=false", the data file is left untouched and charts are NOT redrawn.
# Different -> new json + matplotlib charts in vercel-page/.
# status.json (last check date) is committed every week: the site shows "vérifié le …", and the commit
# counts as repo activity, so GitHub never auto-disables this schedule (60 days without activity).
# The commit redeploys Vercel (git integration). This repo is Vercel-only; the GitHub Pages
# site now lives in achma-learning/theses-maroc (these2/).
#
# Faculty server blocking GitHub's runners? Export the CSV with the FMPM userscript
# (greasyfork #600588, "Exporter CSV brut") and commit it as vercel-page/json/official-export.csv:
# it is used for every year the site doesn't answer.
name: Update data

on:
  schedule:
    - cron: "17 4 * * 1" # every Monday, 04:17 UTC
  workflow_dispatch:
    inputs:
      redraw_charts:
        description: "Redraw the charts even if the data did not change (after editing build_charts.py)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: vercel-page/scripts/requirements.txt

      - run: pip install -r vercel-page/scripts/requirements.txt

      - name: Check the sources, rebuild the data if they changed
        id: data
        run: python vercel-page/scripts/update_theses.py --json vercel-page/json/file.json

      - name: Draw dashboard (matplotlib)
        if: steps.data.outputs.changed == 'true' || inputs.redraw_charts
        run: python vercel-page/scripts/build_charts.py --json vercel-page/json/file.json --out vercel-page/public/stats

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add vercel-page/json vercel-page/public/stats
          if git diff --cached --quiet; then
            echo "Nothing to commit"
          elif [ "${{ steps.data.outputs.changed }}" = "true" ]; then
            git commit -m "data: official site changed, refresh $(date -u +%F)" && git push
          else
            git commit -m "data: weekly check $(date -u +%F), no change" && git push
          fi
